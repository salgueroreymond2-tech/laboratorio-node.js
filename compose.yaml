services:
  mysql:
    image: mysql:8.4
    container_name: securevault-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Configura DB_ROOT_PASSWORD}
      MYSQL_DATABASE: securevault_db
      SV_APP_PASSWORD: ${DB_APP_PASSWORD:?Configura DB_APP_PASSWORD}
      SV_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?Configura DB_MIGRATOR_PASSWORD}
      SV_TEST_PASSWORD: ${DB_TEST_PASSWORD:?Configura DB_TEST_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./scripts/mysql-init-users.sh:/docker-entrypoint-initdb.d/02-users.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  mysql_data:
